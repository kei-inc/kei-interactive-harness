name: nightly

# The deep pass. Runs while you sleep, so it can afford to be slow and thorough.
# Nothing here ever blocks a merge or a deploy. Reports are uploaded as a
# workflow artifact named nightly-reports.

on:
  schedule:
    - cron: "0 7 * * 1-5"   # weekday mornings, UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
{{NODE_SETUP}}
      - name: Full semgrep sweep, every severity, every finding
        continue-on-error: true
        run: |
          pipx install semgrep==1.178.0
          {{H}} semgrep --sweep

      - name: Dependency drift
        continue-on-error: true
        run: {{OUTDATED}} > outdated.json || true

      - name: Dead code and unused dependencies
        continue-on-error: true
        run: |
          if grep -q '"knip"' package.json; then
            {{EXEC}} knip --reporter json > knip.json || true
          else
            echo "::warning title=Nothing ran: knip::knip is not installed, so dead code and unused dependencies were not checked."
            echo "- :warning: **knip**: nothing ran (not installed)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ratchet trend
        run: {{H}} ratchet --show | tee ratchet-trend.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-reports
          path: |
            semgrep-nightly.json
            outdated.json
            knip.json
            ratchet-trend.txt
          retention-days: 30

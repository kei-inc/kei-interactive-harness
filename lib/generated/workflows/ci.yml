# Regenerated by harness sync, so put your own jobs (deploy, previews, and so
# on) in a separate workflow file rather than editing this one.
#
# Assumes npm. For pnpm, swap the setup-node cache value and the install
# command, or set HARNESS_DISABLE and run checks from your own workflow.

name: harness

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback. Should finish in a couple of minutes.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the new-code check needs the merge base
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Boundaries
        env:
          CI_TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: npx harness boundaries
      - name: Stack checks
        run: npx harness stack
      - name: Ratchet (enforced here, soft in the hooks)
        run: npx harness ratchet --check
      - name: New code introduced by this branch
        if: github.event_name == 'pull_request'
        run: npx harness ratchet --new "origin/${{ github.base_ref }}"
      - name: Types
        run: npm run typecheck --if-present
      - name: Lint
        run: npm run lint --if-present
      - name: Unit tests
        run: npm run test:unit --if-present

  # Security. Separate job so a slow scan does not delay the fast signal.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history

      - name: Secrets in history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit

      - name: Static analysis
        run: |
          pip install --quiet semgrep
          semgrep --config "$(npx harness lib)/semgrep.yml" \
                  --config p/owasp-top-ten \
                  --config p/secrets \
                  --error --quiet .

      - name: Dependency vulnerabilities
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  # Build and weight.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run build --if-present
      - name: Bundle budget
        run: npm run size --if-present

  # End to end. Only on pull requests, because it is the slow one.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --if-present
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The most important job in this file. Audits the live database that backs the
  # branch, because RLS is the real perimeter in a Supabase app.
  #
  # Set SUPABASE_DB_URL as a repository secret. Point it at a Supabase branch
  # database for pull requests, or at production read-only. Every query the audit
  # runs is a catalogue read, so it is safe against production.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Row level security audit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx harness rls
      - name: Supabase linter
        if: ${{ secrets.SUPABASE_DB_URL != '' }}
        continue-on-error: true
        run: npx --yes supabase@latest db lint --db-url "${{ secrets.SUPABASE_DB_URL }}" --level warning
